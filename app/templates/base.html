<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    
    {# SEO Meta Tags #}
    <title>{{ meta_title or headline }}</title>
    <meta name="description" content="{{ meta_description }}">
    <meta name="keywords" content="{{ keywords_string }}">
    
    {# Open Graph Meta Tags #}
    <meta property="og:title" content="{{ og_title or meta_title }}">
    <meta property="og:description" content="{{ og_description or meta_description }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page_url }}">
    
    {# Twitter Card Meta Tags #}
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ og_title or meta_title }}">
    <meta name="twitter:description" content="{{ og_description or meta_description }}">
    
    {# Favicon #}
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='%234F46E5'/%3E%3C/svg%3E">
    
    {# Custom CSS #}
    <link rel="stylesheet" href="{{ css_path }}">
    
    {# Google Fonts #}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    {% block extra_head %}{% endblock %}
</head>
<body class="theme-{{ theme }}">
    {% block content %}{% endblock %}
    
    {# Smooth Scroll Script #}
    <script>
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            });
        });
        
        // Intersection Observer for fade-in animations
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };
        
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('fade-in-visible');
                }
            });
        }, observerOptions);
        
        document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
        
        // View count tracker
        {% if page_id %}
        fetch('/api/v1/landing-pages/{{ page_id }}/view', { method: 'POST' })
            .catch(err => console.error('View tracking failed:', err));
        {% endif %}
    </script>
    
    {% block extra_scripts %}{% endblock %}
</body>
</html>
